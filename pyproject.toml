[project]
name = "hermes"
version = "4.0.0"
description = "HERMES: modulo de ventas y atencion multicanal de DEUS"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2,<5.0",
    "uvicorn>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes", "hermes.channels"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
